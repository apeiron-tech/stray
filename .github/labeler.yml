# Path → area label mapping for the PR auto-labeler (actions/labeler v5).
# Keep in sync with the labels defined on the repo and the docs/context fragments.

"area:api":
  - changed-files:
      - any-glob-to-any-file: 'src/stray/api.py'

"area:proxy":
  - changed-files:
      - any-glob-to-any-file: 'src/stray/infra/upstream/relay.py'

"area:auth-secrets":
  - changed-files:
      - any-glob-to-any-file:
          - 'src/stray/infra/upstream/injectors.py'
          - 'src/stray/crypto.py'
          - 'src/stray/oauth.py'
          - 'src/stray/domain/identity/session.py'
          - 'src/stray/email.py'
          - 'src/stray/health.py'
          - 'src/stray/ratestore.py'

"area:cli":
  - changed-files:
      - any-glob-to-any-file:
          - 'src/stray/cli.py'
          - 'src/stray/convert.py'
          - 'src/stray/shell.py'

"area:runner":
  - changed-files:
      - any-glob-to-any-file:
          - 'src/stray/runner.py'
          - 'src/stray/localrun.py'
          - 'src/stray/egress.py'
          - 'src/stray/fsjail.py'

"area:dashboard":
  - changed-files:
      - any-glob-to-any-file: 'src/stray/web/**'

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'

"area:ci":
  - changed-files:
      - any-glob-to-any-file: '.github/**'
